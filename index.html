<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도시계획기사 학습실</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="학습 메뉴">
        <div class="brand">
          <span class="brand-mark">UP</span>
          <div>
            <strong>도시계획기사</strong>
            <span>필기부터 실기까지</span>
          </div>
        </div>

        <nav class="nav-list" id="navList">
          <button class="nav-item is-active" data-view="dashboard" type="button">
            <span>대시보드</span>
          </button>
          <button class="nav-item" data-view="writtenLecture" type="button">
            <span>1차 필기 기본강의</span>
          </button>
          <button class="nav-item" data-view="writtenQuiz" type="button">
            <span>1차 필기 기출풀이</span>
          </button>
          <button class="nav-item" data-view="practicalLecture" type="button">
            <span>3차 실기 기본강의</span>
          </button>
          <button class="nav-item" data-view="practicalQuiz" type="button">
            <span>3차 실기 기출유형</span>
          </button>
          <button class="nav-item" data-view="finalLab" type="button">
            <span>실전 연습실</span>
          </button>
        </nav>

        <div class="sidebar-note">
          <span class="eyebrow">오늘의 기준</span>
          <strong id="todayText"></strong>
          <p>필기는 과목별 과락을 막고, 실기는 도면과 산출 근거를 같이 잡습니다.</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <span class="eyebrow">Engineer Urban Planning</span>
            <h1 id="pageTitle">도시계획기사 학습실</h1>
          </div>
          <div class="top-actions">
            <button class="ghost-button" id="resetProgress" type="button">진도 초기화</button>
          </div>
        </header>

        <section class="content" id="app" tabindex="-1"></section>

        <footer class="footer">
          <span>자료 구조 기준: Q-Net 도시계획기사 종목별 상세정보와 2024.1.1~2026.12.31 출제기준.</span>
          <a href="https://www.q-net.or.kr/crf005.do?id=crf00503&jmCd=1350" target="_blank" rel="noreferrer">Q-Net 확인</a>
        </footer>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
